<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="260" viewBox="0 0 1050 260" role="img" aria-label="Pham Minh Kha animated pixel hero">
  <defs>
    <clipPath id="reveal"><rect x="45" y="48" width="0" height="120"><animate attributeName="width" from="0" to="960" dur="1.7s" begin="0.2s" fill="freeze"/></rect></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#fff" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    .ink{fill:#f5f5f5}.muted{fill:#a8a8a8}.line{stroke:#f5f5f5}.pixel{shape-rendering:crispEdges}
    .glitchA{animation:gA 5.2s steps(1,end) infinite}.glitchB{animation:gB 6.1s steps(1,end) infinite}.cursor{animation:blink .8s steps(1,end) infinite}.scan{animation:scan 4.2s linear infinite}
    @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
    @keyframes gA{0%,91%,100%{transform:translate(0,0);opacity:0}92%{transform:translate(-6px,2px);opacity:.16}94%{transform:translate(4px,-1px);opacity:.10}96%{opacity:0}}
    @keyframes gB{0%,86%,100%{transform:translate(0,0);opacity:0}87%{transform:translate(5px,-2px);opacity:.12}89%{transform:translate(-3px,1px);opacity:.08}91%{opacity:0}}
    @keyframes scan{0%{transform:translateY(-40px)}100%{transform:translateY(300px)}}
  </style>
  <rect width="1050" height="260" fill="transparent"/>
  <rect x="12" y="12" width="1026" height="236" rx="10" fill="none" class="line" stroke-width="3"/>
  <g class="pixel ink">
    <rect x="24" y="24" width="12" height="12"/><rect x="40" y="24" width="12" height="12"/><rect x="24" y="40" width="12" height="12"/>
    <rect x="1014" y="208" width="12" height="12"/><rect x="998" y="224" width="12" height="12"/><rect x="1014" y="224" width="12" height="12"/>
  </g>
  <g clip-path="url(#reveal)" filter="url(#shadow)">
    <text x="525" y="126" text-anchor="middle" class="ink pixel" font-family="monospace" font-weight="900" font-size="72" letter-spacing="3">PHAM MINH KHA</text>
  </g>
  <text x="525" y="126" text-anchor="middle" class="ink glitchA" font-family="monospace" font-weight="900" font-size="72" letter-spacing="3">PHAM MINH KHA</text>
  <text x="525" y="126" text-anchor="middle" class="ink glitchB" font-family="monospace" font-weight="900" font-size="72" letter-spacing="3">PHAM MINH KHA</text>
  <text x="525" y="178" text-anchor="middle" class="ink" font-family="monospace" font-weight="700" font-size="22" letter-spacing="4">R&amp;D / BACKEND ENGINEER</text>
  <text x="525" y="210" text-anchor="middle" class="muted" font-family="monospace" font-size="16" letter-spacing="2">SYSTEMS • DATABASES • AI / LLM • AUTOMATION</text>
  <rect x="846" y="92" width="18" height="42" class="ink cursor pixel"/>
  <rect x="20" y="18" width="1010" height="4" fill="#fff" opacity=".04" class="scan"/>
</svg>