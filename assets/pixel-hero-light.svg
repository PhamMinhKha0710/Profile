<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-label="Pham Minh Kha systems lab animated banner">
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#000" stroke-opacity=".045" stroke-width="1"/></pattern>
    <clipPath id="nameReveal"><rect x="62" y="92" width="0" height="118"><animate attributeName="width" from="0" to="976" dur="1.45s" begin=".25s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    .ink{fill:#050505}.muted{fill:#555}.line{stroke:#050505}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.pixel{shape-rendering:crispEdges}
    .blink{animation:blink .82s steps(1,end) infinite}.glitch1{animation:g1 6.4s steps(1,end) infinite}.glitch2{animation:g2 7.1s steps(1,end) infinite}.dash{stroke-dasharray:10 12;animation:flow 2.2s linear infinite}.p1{animation:p1 4s linear infinite}.p2{animation:p2 4s linear 1.1s infinite}.p3{animation:p3 4s linear 2.2s infinite}.pulse{animation:pulse 1.6s ease-in-out infinite}
    @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}@keyframes flow{to{stroke-dashoffset:-44}}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
    @keyframes p1{0%{transform:translateX(0)}100%{transform:translateX(760px)}}@keyframes p2{0%{transform:translateX(0)}100%{transform:translateX(760px)}}@keyframes p3{0%{transform:translateX(0)}100%{transform:translateX(760px)}}
    @keyframes g1{0%,92%,100%{transform:translate(0);opacity:0}93%{transform:translate(-7px,2px);opacity:.16}95%{transform:translate(5px,-1px);opacity:.10}97%{opacity:0}}@keyframes g2{0%,86%,100%{transform:translate(0);opacity:0}87%{transform:translate(6px,-2px);opacity:.12}89%{transform:translate(-4px,1px);opacity:.08}91%{opacity:0}}
  </style>
  <rect width="1100" height="340" fill="transparent"/><rect x="12" y="12" width="1076" height="316" rx="8" fill="url(#grid)" stroke="#050505" stroke-width="3"/>
  <rect x="30" y="30" width="192" height="34" class="ink pixel"/><text x="126" y="53" text-anchor="middle" fill="#fff" class="mono" font-size="15" font-weight="800" letter-spacing="2">PMK::LAB/0710</text>
  <text x="1065" y="52" text-anchor="end" class="mono muted" font-size="13" letter-spacing="1.5">STATUS / BUILDING</text><circle cx="1074" cy="47" r="4" class="ink pulse"/>
  <g clip-path="url(#nameReveal)"><text x="550" y="178" text-anchor="middle" class="mono ink" font-size="78" font-weight="950" letter-spacing="2">PHAM MINH KHA</text></g>
  <text x="550" y="178" text-anchor="middle" class="mono ink glitch1" font-size="78" font-weight="950" letter-spacing="2">PHAM MINH KHA</text><text x="550" y="178" text-anchor="middle" class="mono ink glitch2" font-size="78" font-weight="950" letter-spacing="2">PHAM MINH KHA</text>
  <text x="550" y="223" text-anchor="middle" class="mono ink" font-size="21" font-weight="800" letter-spacing="5">R&amp;D / BACKEND ENGINEER</text>
  <text x="550" y="254" text-anchor="middle" class="mono muted" font-size="15" letter-spacing="3">BACKEND SYSTEMS  //  DATABASES  //  AUTOMATION</text>
  <line x1="120" y1="286" x2="980" y2="286" class="line dash" stroke-width="2"/><g class="ink pixel"><rect x="140" y="280" width="12" height="12" class="p1"/><rect x="140" y="280" width="12" height="12" class="p2"/><rect x="140" y="280" width="12" height="12" class="p3"/></g>
  <text x="550" y="316" text-anchor="middle" class="mono ink" font-size="13" font-weight="700" letter-spacing="4">TRACE  /  BUILD  /  TUNE</text>
  <rect x="997" y="143" width="16" height="40" class="ink blink pixel"/>
</svg>